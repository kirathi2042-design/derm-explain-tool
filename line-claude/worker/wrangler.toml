name = "line-claude-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Public LIFF URL (Pages deployment). Used in Rich Menu and webhook replies.
[vars]
LIFF_BASE_URL = "https://your-liff.pages.dev"
PUBLIC_WORKER_URL = "https://line-claude-worker.your-subdomain.workers.dev"
MAX_DAILY_TASKS = "50"

# KV: settings, allowlist, quota, jobs
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_ID"

# R2: PDF and file storage
[[r2_buckets]]
binding = "FILES"
bucket_name = "line-claude-files"

# Queue for async long tasks
[[queues.producers]]
binding = "TASK_QUEUE"
queue = "line-claude-tasks"

[[queues.consumers]]
queue = "line-claude-tasks"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 2
dead_letter_queue = "line-claude-tasks-dlq"

# Secrets (set with `wrangler secret put`):
#   LINE_CHANNEL_ACCESS_TOKEN
#   LINE_CHANNEL_SECRET
#   LINE_LOGIN_CHANNEL_ID    (for LIFF id_token verification)
#   ANTHROPIC_API_KEY
#   NOTION_TOKEN             (P4)
#   NOTION_DATABASE_ID       (P4)
#   OWNER_USER_ID            (your own LINE userId, allowlist root)
