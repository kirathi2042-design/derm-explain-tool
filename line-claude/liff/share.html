<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>分享到群組</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<main class="page">
  <a href="./index.html" class="back">← 回主選單</a>
  <h2 style="margin:0 0 12px;">分享到群組</h2>
  <p class="muted small">寫一段話，挑朋友或群組一鍵分享。</p>

  <textarea id="text" placeholder="想分享什麼？"></textarea>
  <div class="row" style="margin-top:8px;">
    <button id="ai" class="btn secondary">✨ 讓 Claude 潤稿</button>
  </div>
  <div class="row">
    <button id="share" class="btn" disabled>📤 挑收件人分享</button>
  </div>
  <div class="log" id="log">寫一段話開始</div>
</main>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="./liff-client.js"></script>
<script>
(async () => {
  await LC.ready();
  const text = document.getElementById('text');
  const ai = document.getElementById('ai');
  const share = document.getElementById('share');
  const log = document.getElementById('log');

  text.addEventListener('input', () => { share.disabled = text.value.trim().length === 0; });

  ai.addEventListener('click', async () => {
    if (text.value.trim().length === 0) { LC.setStatus(log, '先寫點東西。'); return; }
    ai.disabled = true;
    LC.setStatus(log, 'Claude 潤稿中…', true);
    try {
      // Reuse the chat path via sendMessages would be slow; call a small API instead by sending into chat.
      // Simpler: ask user to write themselves, or call a dedicated /api endpoint. For now, send to chat.
      if (!liff.isInClient()) { LC.setStatus(log, '請在 LINE 內開啟。'); ai.disabled = false; return; }
      await liff.sendMessages([{ type: 'text', text: `潤稿：${text.value}` }]);
      LC.setStatus(log, '已送出潤稿請求，看聊天框結果。');
    } catch (e) {
      LC.setStatus(log, '錯誤：' + e.message);
    } finally {
      ai.disabled = false;
    }
  });

  share.addEventListener('click', async () => {
    if (!liff.isApiAvailable('shareTargetPicker')) {
      LC.setStatus(log, '此 LIFF 未開啟 shareTargetPicker。請到 LINE Developers Console 啟用。');
      return;
    }
    try {
      const r = await liff.shareTargetPicker([{ type: 'text', text: text.value }]);
      LC.setStatus(log, r ? '送出 ✓' : '已取消。');
    } catch (e) {
      LC.setStatus(log, '失敗：' + e.message);
    }
  });
})();
</script>
</body>
</html>
