<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>語音待辦</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<main class="page">
  <a href="./index.html" class="back">← 回主選單</a>
  <h2 style="margin:0 0 12px;">語音待辦</h2>
  <p class="muted small">按住下方按鈕說話。鬆開即送出。iOS Safari 16+ 支援。</p>

  <textarea id="transcript" placeholder="即時辨識文字會出現在這裡，也能直接打字。"></textarea>

  <label style="display:flex;align-items:center;gap:8px;margin:12px 0;font-size:14px;">
    <input type="checkbox" id="saveNotion" checked> 同時存進 Notion
  </label>

  <div class="row">
    <button id="rec" class="btn" style="touch-action:none;">🎙 按住說話</button>
  </div>
  <div class="row">
    <button id="send" class="btn secondary" disabled>送出整理</button>
  </div>
  <div class="log" id="log">點按鈕開始錄音 🎤</div>
</main>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="./liff-client.js"></script>
<script>
(async () => {
  await LC.ready();
  const transcript = document.getElementById('transcript');
  const rec = document.getElementById('rec');
  const send = document.getElementById('send');
  const log = document.getElementById('log');
  const saveNotion = document.getElementById('saveNotion');

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    LC.setStatus(log, '此瀏覽器不支援即時語音辨識。請打字輸入再按送出。');
    rec.disabled = true;
  } else {
    const recog = new SR();
    recog.lang = 'zh-TW';
    recog.continuous = true;
    recog.interimResults = true;
    let final = '';

    recog.onresult = (ev) => {
      let interim = '';
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const t = ev.results[i][0].transcript;
        if (ev.results[i].isFinal) final += t;
        else interim += t;
      }
      transcript.value = final + interim;
      send.disabled = transcript.value.trim().length === 0;
    };
    recog.onerror = (e) => LC.setStatus(log, '辨識錯誤：' + e.error);

    const start = () => {
      final = transcript.value;
      try { recog.start(); LC.setStatus(log, '錄音中…放開停止', true); rec.classList.add('rec'); } catch {}
    };
    const stop = () => { try { recog.stop(); } catch {} rec.classList.remove('rec'); LC.setStatus(log, '錄音停止。可繼續說或送出。'); };

    rec.addEventListener('touchstart', (e) => { e.preventDefault(); start(); });
    rec.addEventListener('touchend', (e) => { e.preventDefault(); stop(); });
    rec.addEventListener('mousedown', start);
    rec.addEventListener('mouseup', stop);
    rec.addEventListener('mouseleave', stop);
  }

  transcript.addEventListener('input', () => {
    send.disabled = transcript.value.trim().length === 0;
  });

  send.addEventListener('click', async () => {
    send.disabled = true;
    LC.setStatus(log, '整理中…', true);
    try {
      const r = await LC.api('/api/voice', {
        method: 'POST',
        body: JSON.stringify({
          idToken: liff.getIDToken() ?? '',
          transcript: transcript.value,
          saveToNotion: saveNotion.checked,
        }),
      });
      const j = await r.json();
      if (!j.ok) { LC.setStatus(log, '失敗：' + (j.error ?? r.status)); send.disabled = false; return; }
      LC.setStatus(log, '已整理並推送到 LINE。' + (j.notionUrl ? '\n→ Notion: ' + j.notionUrl : ''));
      setTimeout(() => { if (liff.isInClient()) liff.closeWindow(); }, 2500);
    } catch (e) {
      LC.setStatus(log, '錯誤：' + e.message);
      send.disabled = false;
    }
  });
})();
</script>
</body>
</html>
