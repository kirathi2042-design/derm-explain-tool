<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>拍照問 Claude</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<main class="page">
  <a href="./index.html" class="back">← 回主選單</a>
  <h2 style="margin:0 0 12px;">拍照問 Claude</h2>

  <div class="row">
    <label class="btn" for="file" style="text-align:center;">📷 拍照 / 選圖</label>
    <input id="file" type="file" accept="image/*" capture="environment" hidden>
  </div>

  <div class="preview" id="preview" hidden><img id="img" alt=""></div>

  <textarea id="prompt" placeholder="想問什麼？（例：這是什麼植物？菜單翻成中文）留白 = 自動分析"></textarea>

  <div class="row" style="margin-top:8px;">
    <button class="btn" id="ask" disabled>送出</button>
  </div>
  <div class="log" id="log">選一張圖開始 👆</div>
</main>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="./liff-client.js"></script>
<script>
(async () => {
  await LC.ready();
  const fileInput = document.getElementById('file');
  const img = document.getElementById('img');
  const preview = document.getElementById('preview');
  const ask = document.getElementById('ask');
  const log = document.getElementById('log');
  const promptEl = document.getElementById('prompt');
  let blob = null;

  fileInput.addEventListener('change', () => {
    const f = fileInput.files?.[0];
    if (!f) return;
    blob = f;
    img.src = URL.createObjectURL(f);
    preview.hidden = false;
    ask.disabled = false;
    LC.setStatus(log, '看起來不錯，按「送出」分析。');
  });

  ask.addEventListener('click', async () => {
    if (!blob) return;
    ask.disabled = true;
    LC.setStatus(log, 'Claude 看圖中…', true);
    try {
      const fd = new FormData();
      fd.append('image', blob, 'photo.jpg');
      fd.append('prompt', promptEl.value);
      fd.append('idToken', liff.getIDToken() ?? '');
      const r = await LC.api('/api/vision', { method: 'POST', body: fd });
      const j = await r.json();
      if (!j.ok) { LC.setStatus(log, '失敗：' + (j.error ?? r.status)); ask.disabled = false; return; }
      LC.setStatus(log, j.answer);
      // Also pushed to LINE chat; offer to go back to chat.
      setTimeout(() => { if (liff.isInClient()) liff.closeWindow(); }, 2500);
    } catch (e) {
      LC.setStatus(log, '錯誤：' + e.message);
      ask.disabled = false;
    }
  });
})();
</script>
</body>
</html>
